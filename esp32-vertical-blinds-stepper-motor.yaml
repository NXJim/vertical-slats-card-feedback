esphome:
  name: master-bed-blinds
  friendly_name: Master Bedroom Blinds
  min_version: 2024.11.0

  on_boot:
    priority: -500
    then:
      - script.execute: wake_driver
      - script.execute: apply_runtime_tuning
      - script.execute: apply_microstep_mode
      - select.set:
          id: microstep_select
          option: !lambda |-
            int ms = id(g_microstep_mode);
            if (ms == 1) return std::string("full");
            if (ms == 2) return std::string("1/2");
            if (ms == 4) return std::string("1/4");
            if (ms == 8) return std::string("1/8");
            return std::string("1/16");
      - stepper.report_position:
          id: blind_stepper
          position: !lambda "return id(saved_position);"
      - stepper.set_target:
          id: blind_stepper
          target: !lambda "return id(saved_position);"
      - script.execute: publish_all
      - script.execute: post_move_sleep_manager
      - script.execute: stepper_sensor_loop

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.230.120
    gateway: 192.168.230.1
    subnet: 255.255.255.0

api:
  encryption:
    key: !secret api_key

globals:
  # ============================================================================
  # DEBUG FLAG - Set to true to enable verbose logging for sleep/wake operations
  # Set to false for production use to reduce log noise
  # ============================================================================
  - id: g_debug_sleep_wake
    type: bool
    initial_value: "true"
    restore_value: false

  - id: saved_position
    type: int
    initial_value: "1"
    restore_value: true

  - id: g_open_steps
    type: int
    initial_value: "1000"
    restore_value: true

  - id: g_closed_steps
    type: int
    initial_value: "1"
    restore_value: true

  - id: g_speed_sps
    type: int
    initial_value: "600"
    restore_value: true

  - id: g_accel_sps2
    type: int
    initial_value: "200"
    restore_value: true

  - id: g_decel_sps2
    type: int
    initial_value: "200"
    restore_value: true

  - id: g_sleep_delay_s
    type: int
    initial_value: "30"
    restore_value: true

  - id: g_max_travel_steps
    type: int
    initial_value: "2000"
    restore_value: true

  - id: g_nudge_steps
    type: int
    initial_value: "10"
    restore_value: true

  - id: g_min_delta_steps
    type: int
    initial_value: "2"
    restore_value: true

  - id: g_cover_publish_ms
    type: int
    initial_value: "200"
    restore_value: true

  - id: g_sensor_interval_s
    type: int
    initial_value: "5"
    restore_value: true

  - id: g_microstep_mode
    type: int
    initial_value: "16"
    restore_value: true

  - id: g_last_microstep_mode
    type: int
    initial_value: "16"
    restore_value: true

  - id: target_position
    type: int
    initial_value: "1"

output:
  - platform: gpio
    pin: GPIO2
    id: motor_led

  # SLEEP + RESET tied together to GPIO27
  - platform: gpio
    pin: GPIO27
    id: a4988_sleep_pin

  # ENABLE on GPIO21 (active-low)
  - platform: gpio
    pin: GPIO21
    id: a4988_enable_pin

  - platform: gpio
    pin: GPIO33
    id: a4988_ms1

  - platform: gpio
    pin: GPIO32
    id: a4988_ms2

  - platform: gpio
    pin: GPIO23
    id: a4988_ms3

stepper:
  - platform: a4988
    id: blind_stepper
    dir_pin: GPIO25
    step_pin: GPIO26
    max_speed: 600 steps/s
    acceleration: 200
    deceleration: 200

switch:
  # ============================================================================
  # DEBUG SWITCH - Exposes debug flag to Home Assistant for runtime control
  # Turn ON to see verbose sleep/wake logging, OFF for quiet operation
  # ============================================================================
  - platform: template
    id: debug_sleep_wake_switch
    name: "Debug Sleep-Wake Logging"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: "return id(g_debug_sleep_wake);"
    turn_on_action:
      - globals.set:
          id: g_debug_sleep_wake
          value: "true"
      - logger.log: "DEBUG: Sleep/wake logging ENABLED"
    turn_off_action:
      - globals.set:
          id: g_debug_sleep_wake
          value: "false"
      - logger.log: "DEBUG: Sleep/wake logging DISABLED"

  - platform: template
    id: allow_driver_sleep
    name: "Motor sleep allowed"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: post_move_sleep_manager
    turn_off_action:
      - script.execute: wake_driver

  # Manual control of EN (A4988 ENABLE)
  # ON  = outputs enabled (EN LOW)
  # OFF = outputs disabled (EN HIGH)
  - platform: template
    id: manual_driver_enable
    name: "Motor enable (manual)"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - output.turn_off: a4988_enable_pin
    turn_off_action:
      - output.turn_on: a4988_enable_pin

  - platform: template
    id: scale_steps_on_microstep_change
    name: "Scale steps on microstep change"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

number:
  - platform: template
    id: ha_speed_sps
    name: "Speed (steps per second)"
    min_value: 10
    max_value: 5000
    step: 1
    mode: box
    lambda: "return id(g_speed_sps);"
    set_action:
      - globals.set:
          id: g_speed_sps
          value: !lambda "return (int) x;"
      - script.execute: apply_runtime_tuning

  - platform: template
    id: ha_accel_sps2
    name: "Acceleration (steps per second squared)"
    min_value: 1
    max_value: 20000
    step: 1
    mode: box
    lambda: "return id(g_accel_sps2);"
    set_action:
      - globals.set:
          id: g_accel_sps2
          value: !lambda "return (int) x;"
      - script.execute: apply_runtime_tuning

  - platform: template
    id: ha_decel_sps2
    name: "Deceleration (steps per second squared)"
    min_value: 1
    max_value: 20000
    step: 1
    mode: box
    lambda: "return id(g_decel_sps2);"
    set_action:
      - globals.set:
          id: g_decel_sps2
          value: !lambda "return (int) x;"
      - script.execute: apply_runtime_tuning

  - platform: template
    id: ha_open_steps
    name: "Open position (steps)"
    min_value: -200000
    max_value: 200000
    step: 1
    mode: box
    lambda: "return id(g_open_steps);"
    set_action:
      - globals.set:
          id: g_open_steps
          value: !lambda "return (int) x;"
      - script.execute: publish_all

  - platform: template
    id: ha_closed_steps
    name: "Closed position (steps)"
    min_value: -200000
    max_value: 200000
    step: 1
    mode: box
    lambda: "return id(g_closed_steps);"
    set_action:
      - globals.set:
          id: g_closed_steps
          value: !lambda "return (int) x;"
      - script.execute: publish_all

  - platform: template
    id: ha_sleep_delay_s
    name: "Sleep delay after move (seconds)"
    min_value: 0
    max_value: 3600
    step: 1
    mode: box
    lambda: "return id(g_sleep_delay_s);"
    set_action:
      - globals.set:
          id: g_sleep_delay_s
          value: !lambda "return (int) x;"
      - script.execute: post_move_sleep_manager

  - platform: template
    id: ha_max_travel_steps
    name: "Max travel (steps)"
    min_value: 10
    max_value: 400000
    step: 1
    mode: box
    lambda: "return id(g_max_travel_steps);"
    set_action:
      - globals.set:
          id: g_max_travel_steps
          value: !lambda "return (int) x;"

  - platform: template
    id: ha_nudge_steps
    name: "Nudge amount (steps)"
    min_value: 1
    max_value: 10000
    step: 1
    mode: box
    lambda: "return id(g_nudge_steps);"
    set_action:
      - globals.set:
          id: g_nudge_steps
          value: !lambda "return (int) x;"

  - platform: template
    id: ha_min_delta_steps
    name: "Minimum move delta (steps)"
    min_value: 0
    max_value: 10000
    step: 1
    mode: box
    lambda: "return id(g_min_delta_steps);"
    set_action:
      - globals.set:
          id: g_min_delta_steps
          value: !lambda "return (int) x;"

  - platform: template
    id: ha_cover_publish_ms
    name: "Cover publish interval during motion (ms)"
    min_value: 50
    max_value: 5000
    step: 10
    mode: box
    lambda: "return id(g_cover_publish_ms);"
    set_action:
      - globals.set:
          id: g_cover_publish_ms
          value: !lambda "return (int) x;"

  - platform: template
    id: ha_sensor_interval_s
    name: "Stepper sensor interval (seconds)"
    min_value: 1
    max_value: 3600
    step: 1
    mode: box
    lambda: "return id(g_sensor_interval_s);"
    set_action:
      - globals.set:
          id: g_sensor_interval_s
          value: !lambda "return (int) x;"

  - platform: template
    id: manual_reported_steps
    name: "Manual current position (steps) - write only"
    min_value: -200000
    max_value: 200000
    step: 1
    mode: box
    optimistic: true
    restore_value: false
    set_action:
      - script.execute: wake_driver
      - stepper.report_position:
          id: blind_stepper
          position: !lambda "return (int) x;"
      - stepper.set_target:
          id: blind_stepper
          target: !lambda "return (int) x;"
      - globals.set:
          id: saved_position
          value: !lambda "return (int) x;"
      - script.execute: publish_all
      - script.execute: post_move_sleep_manager

  - platform: template
    id: manual_reported_open_percent
    name: "Manual current position (open %) - write only"
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    optimistic: true
    restore_value: false
    set_action:
      - script.execute: wake_driver
      - globals.set:
          id: target_position
          value: !lambda |-
            float p = float(x) / 100.0f;
            int open_s = id(g_open_steps);
            int closed_s = id(g_closed_steps);
            int open_eff = open_s;
            if (open_eff <= closed_s) open_eff = closed_s + 1;
            float steps = (p * float(open_eff - closed_s)) + float(closed_s);
            return (int) lroundf(steps);
      - stepper.report_position:
          id: blind_stepper
          position: !lambda "return id(target_position);"
      - stepper.set_target:
          id: blind_stepper
          target: !lambda "return id(target_position);"
      - globals.set:
          id: saved_position
          value: !lambda "return id(target_position);"
      - script.execute: publish_all
      - script.execute: post_move_sleep_manager

select:
  - platform: template
    id: microstep_select
    name: "Microstep mode"
    optimistic: true
    options:
      - "full"
      - "1/2"
      - "1/4"
      - "1/8"
      - "1/16"
    initial_option: "1/16"
    set_action:
      - globals.set:
          id: g_last_microstep_mode
          value: !lambda "return id(g_microstep_mode);"
      - globals.set:
          id: g_microstep_mode
          value: !lambda |-
            if (x == "full") return 1;
            if (x == "1/2") return 2;
            if (x == "1/4") return 4;
            if (x == "1/8") return 8;
            return 16;
      - script.execute: apply_microstep_mode
      - if:
          condition:
            switch.is_on: scale_steps_on_microstep_change
          then:
            - script.execute: rescale_steps_for_microstep_change
      - script.execute: publish_all

button:
  - platform: template
    name: "Nudge open"
    on_press:
      - script.execute: wake_driver
      - script.execute:
          id: move_relative
          steps: !lambda "return abs(id(g_nudge_steps));"

  - platform: template
    name: "Nudge close"
    on_press:
      - script.execute: wake_driver
      - script.execute:
          id: move_relative
          steps: !lambda "return -abs(id(g_nudge_steps));"

  # ============================================================================
  # Force Sleep - Immediately puts driver to sleep, bypassing delay timer
  # Useful for testing or manually silencing a buzzing motor
  # ============================================================================
  - platform: template
    name: "Force sleep now"
    on_press:
      - if:
          condition:
            lambda: "return id(g_debug_sleep_wake);"
          then:
            - lambda: |-
                ESP_LOGI("force_sleep", "[%lu] STARTED | id=force_sleep_button | desc=Manual sleep triggered | action=stopping_scripts",
                  (unsigned long) millis());
      # Stop any pending sleep manager (in case it's mid-delay)
      - script.stop: post_move_sleep_manager
      # Stop any active movement
      - stepper.set_target:
          id: blind_stepper
          target: !lambda "return id(blind_stepper).current_position;"
      # Disable outputs (EN HIGH)
      - output.turn_on: a4988_enable_pin
      - delay: 2ms
      # Enter sleep mode (SLEEP/RESET LOW)
      - output.turn_off: a4988_sleep_pin
      - output.turn_off: motor_led
      - if:
          condition:
            lambda: "return id(g_debug_sleep_wake);"
          then:
            - lambda: |-
                ESP_LOGI("force_sleep", "[%lu] COMPLETE | id=force_sleep_button | enable_pin=HIGH | sleep_pin=LOW | desc=Driver forced to sleep | result=SUCCESS",
                  (unsigned long) millis());

cover:
  - platform: template
    id: blind_cover
    device_class: blind
    name: "Master Bedroom Blinds"
    has_position: true
    optimistic: false

    open_action:
      - logger.log: "Opening"
      - script.execute: wake_driver
      - script.execute: apply_runtime_tuning
      - output.turn_on: motor_led
      - cover.template.publish:
          id: blind_cover
          current_operation: OPENING
      - script.execute:
          id: move_to_steps
          steps: !lambda "return id(g_open_steps);"

    close_action:
      - logger.log: "Closing"
      - script.execute: wake_driver
      - script.execute: apply_runtime_tuning
      - output.turn_on: motor_led
      - cover.template.publish:
          id: blind_cover
          current_operation: CLOSING
      - script.execute:
          id: move_to_steps
          steps: !lambda "return id(g_closed_steps);"

    position_action:
      - logger.log: "Setting position"
      - script.execute: wake_driver
      - script.execute: apply_runtime_tuning
      - cover.template.publish:
          id: blind_cover
          current_operation: IDLE
      - globals.set:
          id: target_position
          value: !lambda |-
            float p = pos;
            if (p < 0.0f) p = 0.0f;
            if (p > 1.0f) p = 1.0f;
            int open_s = id(g_open_steps);
            int closed_s = id(g_closed_steps);
            int open_eff = open_s;
            if (open_eff <= closed_s) open_eff = closed_s + 1;
            float steps = (p * float(open_eff - closed_s)) + float(closed_s);
            return (int) lroundf(steps);
      - script.execute:
          id: move_to_steps
          steps: !lambda "return id(target_position);"

    stop_action:
      - logger.log: "Stopping"
      - stepper.set_target:
          id: blind_stepper
          target: !lambda "return id(blind_stepper).current_position;"
      # motion_publish_loop will detect idle immediately and finalize+sleep
      - script.execute: motion_publish_loop

sensor:
  - platform: template
    id: stepper_pos_sensor
    name: "Current stepper position"
    update_interval: never
    lambda: "return id(blind_stepper).current_position;"

script:
  - id: apply_runtime_tuning
    mode: restart
    then:
      - stepper.set_speed:
          id: blind_stepper
          speed: !lambda "return float(id(g_speed_sps));"
      - stepper.set_acceleration:
          id: blind_stepper
          acceleration: !lambda "return float(id(g_accel_sps2));"
      - stepper.set_deceleration:
          id: blind_stepper
          deceleration: !lambda "return float(id(g_decel_sps2));"

  # ============================================================================
  # wake_driver - Wakes the A4988 driver from sleep
  # 
  # FIX: Added script.stop for post_move_sleep_manager to cancel any pending
  #      sleep operation when waking the driver for a new movement.
  #
  # Flow:
  #   1. Cancel any pending sleep timer (prevents race condition)
  #   2. Bring SLEEP/RESET HIGH (awake)
  #   3. Enable outputs (EN LOW) only if manual_driver_enable is ON
  # ============================================================================
  - id: wake_driver
    mode: restart
    then:
      # DEBUG: Log entry with timestamp and current state
      - if:
          condition:
            lambda: "return id(g_debug_sleep_wake);"
          then:
            - lambda: |-
                ESP_LOGI("wake_driver", "[%lu] STARTED | id=wake_driver | manual_enable=%s | desc=Waking driver from sleep | action=cancel_pending_sleep",
                  (unsigned long) millis(),
                  id(manual_driver_enable).state ? "ON" : "OFF");

      # FIX: Cancel any pending sleep operation to prevent race condition
      # This ensures the sleep manager doesn't put the driver back to sleep
      # immediately after we wake it
      - script.stop: post_move_sleep_manager

      # DEBUG: Log after canceling sleep manager
      - if:
          condition:
            lambda: "return id(g_debug_sleep_wake);"
          then:
            - lambda: |-
                ESP_LOGI("wake_driver", "[%lu] PROGRESS | id=wake_driver | desc=Cancelled pending sleep | action=setting_sleep_pin_high",
                  (unsigned long) millis());

      # Bring SLEEP/RESET pin HIGH to wake the driver
      - output.turn_on: a4988_sleep_pin
      - delay: 2ms

      # Set ENABLE pin based on manual_driver_enable switch state
      - if:
          condition:
            switch.is_on: manual_driver_enable
          then:
            - output.turn_off: a4988_enable_pin  # EN LOW = outputs enabled
            - if:
                condition:
                  lambda: "return id(g_debug_sleep_wake);"
                then:
                  - lambda: |-
                      ESP_LOGI("wake_driver", "[%lu] COMPLETE | id=wake_driver | enable_pin=LOW | desc=Driver awake and enabled | result=SUCCESS",
                        (unsigned long) millis());
          else:
            - output.turn_on: a4988_enable_pin  # EN HIGH = outputs disabled
            - if:
                condition:
                  lambda: "return id(g_debug_sleep_wake);"
                then:
                  - lambda: |-
                      ESP_LOGI("wake_driver", "[%lu] COMPLETE | id=wake_driver | enable_pin=HIGH | desc=Driver awake but disabled | result=SUCCESS",
                        (unsigned long) millis());

  # ============================================================================
  # post_move_sleep_manager - Manages driver sleep after movements complete
  #
  # FIX: Changed mode from 'restart' to 'single' to prevent the sleep timer
  #      from being repeatedly reset by other scripts (like stepper_sensor_loop).
  #      This was causing the driver to never reach the sleep commands.
  #
  # Mode explanation:
  #   - 'restart' (old): New calls restart the script, resetting the timer
  #   - 'single' (new): New calls are ignored while script is running
  #
  # The wake_driver script now explicitly stops this script when waking,
  # allowing movements to interrupt the sleep timer when needed.
  #
  # Flow when allow_driver_sleep is ON:
  #   1. Wait for stepper to become idle
  #   2. Wait for sleep_delay_s seconds
  #   3. Re-verify stepper is still idle
  #   4. Disable outputs (EN HIGH)
  #   5. Enter sleep mode (SLEEP/RESET LOW)
  #
  # Flow when allow_driver_sleep is OFF:
  #   1. Keep driver awake (SLEEP/RESET HIGH)
  #   2. Set EN based on manual_driver_enable
  # ============================================================================
  - id: post_move_sleep_manager
    mode: single  # FIX: Changed from 'restart' - prevents timer reset on each call
    then:
      # DEBUG: Log entry
      - if:
          condition:
            lambda: "return id(g_debug_sleep_wake);"
          then:
            - lambda: |-
                ESP_LOGI("post_move_sleep_manager", "[%lu] STARTED | id=post_move_sleep_manager | allow_sleep=%s | delay_s=%d | desc=Sleep manager initiated",
                  (unsigned long) millis(),
                  id(allow_driver_sleep).state ? "ON" : "OFF",
                  id(g_sleep_delay_s));

      - if:
          condition:
            switch.is_on: allow_driver_sleep
          then:
            # DEBUG: Log waiting for idle
            - if:
                condition:
                  lambda: "return id(g_debug_sleep_wake);"
                then:
                  - lambda: |-
                      ESP_LOGI("post_move_sleep_manager", "[%lu] PROGRESS | id=post_move_sleep_manager | desc=Waiting for stepper idle | action=wait_until_idle",
                        (unsigned long) millis());

            # Wait for stepper to finish any movement
            - wait_until:
                condition:
                  lambda: "return id(blind_stepper).current_position == id(blind_stepper).target_position;"

            # DEBUG: Log stepper is idle, starting delay
            - if:
                condition:
                  lambda: "return id(g_debug_sleep_wake);"
                then:
                  - lambda: |-
                      ESP_LOGI("post_move_sleep_manager", "[%lu] PROGRESS | id=post_move_sleep_manager | desc=Stepper idle, starting delay | delay_s=%d",
                        (unsigned long) millis(),
                        id(g_sleep_delay_s));

            # Wait for configured delay (0 = immediate sleep)
            - if:
                condition:
                  lambda: "return id(g_sleep_delay_s) > 0;"
                then:
                  - delay: !lambda "return (uint32_t) (id(g_sleep_delay_s) * 1000);"

                  # DEBUG: Log delay complete
                  - if:
                      condition:
                        lambda: "return id(g_debug_sleep_wake);"
                      then:
                        - lambda: |-
                            ESP_LOGI("post_move_sleep_manager", "[%lu] PROGRESS | id=post_move_sleep_manager | desc=Delay complete, re-checking idle",
                              (unsigned long) millis());

                  # Re-verify stepper is still idle after delay
                  - wait_until:
                      condition:
                        lambda: "return id(blind_stepper).current_position == id(blind_stepper).target_position;"

            # DEBUG: Log about to sleep
            - if:
                condition:
                  lambda: "return id(g_debug_sleep_wake);"
                then:
                  - lambda: |-
                      ESP_LOGI("post_move_sleep_manager", "[%lu] PROGRESS | id=post_move_sleep_manager | desc=Putting driver to sleep NOW | action=disable_and_sleep",
                        (unsigned long) millis());

            # Disable outputs first (EN HIGH)
            - output.turn_on: a4988_enable_pin
            - delay: 2ms

            # Enter sleep mode (SLEEP/RESET LOW)
            - output.turn_off: a4988_sleep_pin

            # DEBUG: Log completion
            - if:
                condition:
                  lambda: "return id(g_debug_sleep_wake);"
                then:
                  - lambda: |-
                      ESP_LOGI("post_move_sleep_manager", "[%lu] COMPLETE | id=post_move_sleep_manager | enable_pin=HIGH | sleep_pin=LOW | desc=Driver is now sleeping | result=SUCCESS",
                        (unsigned long) millis());

          else:
            # Sleep not allowed - keep driver awake
            - if:
                condition:
                  lambda: "return id(g_debug_sleep_wake);"
                then:
                  - lambda: |-
                      ESP_LOGI("post_move_sleep_manager", "[%lu] PROGRESS | id=post_move_sleep_manager | desc=Sleep disabled, keeping driver awake",
                        (unsigned long) millis());

            # Keep driver awake (SLEEP/RESET HIGH)
            - output.turn_on: a4988_sleep_pin
            - delay: 2ms

            # Set EN based on manual_driver_enable
            - if:
                condition:
                  switch.is_on: manual_driver_enable
                then:
                  - output.turn_off: a4988_enable_pin  # EN LOW = enabled
                  - if:
                      condition:
                        lambda: "return id(g_debug_sleep_wake);"
                      then:
                        - lambda: |-
                            ESP_LOGI("post_move_sleep_manager", "[%lu] COMPLETE | id=post_move_sleep_manager | enable_pin=LOW | sleep_pin=HIGH | desc=Driver awake and enabled | result=SUCCESS",
                              (unsigned long) millis());
                else:
                  - output.turn_on: a4988_enable_pin  # EN HIGH = disabled
                  - if:
                      condition:
                        lambda: "return id(g_debug_sleep_wake);"
                      then:
                        - lambda: |-
                            ESP_LOGI("post_move_sleep_manager", "[%lu] COMPLETE | id=post_move_sleep_manager | enable_pin=HIGH | sleep_pin=HIGH | desc=Driver awake but disabled | result=SUCCESS",
                              (unsigned long) millis());

  # NOTE: finalize_move script removed - all finalization/sleep logic now in motion_publish_loop

  - id: motion_publish_loop
    mode: restart
    then:
      # Publish position while stepper is moving toward target
      - while:
          condition:
            # component.is_idle doesn't work reliably for steppers
            # Instead, check if current position differs from target
            lambda: "return id(blind_stepper).current_position != id(blind_stepper).target_position;"
          then:
            - script.execute: publish_all
            - delay: !lambda "return (uint32_t) id(g_cover_publish_ms);"

      # ========================================================================
      # FINALIZE AND SLEEP - Runs after stepper becomes idle
      # All finalization and sleep logic is now inline here to avoid script
      # coordination issues. When this script restarts (new move), everything
      # including pending sleep is properly cancelled.
      # ========================================================================
      - if:
          condition:
            lambda: "return id(g_debug_sleep_wake);"
          then:
            - lambda: |-
                ESP_LOGI("motion_publish_loop", "[%lu] IDLE_DETECTED | id=motion_publish_loop | pos=%d | desc=Stepper now idle, finalizing",
                  (unsigned long) millis(), id(blind_stepper).current_position);

      - output.turn_off: motor_led
      - globals.set:
          id: saved_position
          value: !lambda "return id(blind_stepper).current_position;"
      - script.execute: publish_all
      - cover.template.publish:
          id: blind_cover
          current_operation: IDLE

      # Sleep logic (only if allowed)
      - if:
          condition:
            switch.is_on: allow_driver_sleep
          then:
            - if:
                condition:
                  lambda: "return id(g_debug_sleep_wake);"
                then:
                  - lambda: |-
                      ESP_LOGI("motion_publish_loop", "[%lu] SLEEP_WAIT | id=motion_publish_loop | delay_s=%d | desc=Starting sleep delay",
                        (unsigned long) millis(), id(g_sleep_delay_s));

            # Wait configured delay before sleeping (0 = immediate)
            - if:
                condition:
                  lambda: "return id(g_sleep_delay_s) > 0;"
                then:
                  - delay: !lambda "return (uint32_t) (id(g_sleep_delay_s) * 1000);"

            # Re-verify stepper is still idle after delay
            - wait_until:
                condition:
                  lambda: "return id(blind_stepper).current_position == id(blind_stepper).target_position;"

            - if:
                condition:
                  lambda: "return id(g_debug_sleep_wake);"
                then:
                  - lambda: |-
                      ESP_LOGI("motion_publish_loop", "[%lu] SLEEPING | id=motion_publish_loop | desc=Putting driver to sleep NOW",
                        (unsigned long) millis());

            # Disable outputs (EN HIGH), then sleep (SLEEP/RESET LOW)
            - output.turn_on: a4988_enable_pin
            - delay: 2ms
            - output.turn_off: a4988_sleep_pin

            - if:
                condition:
                  lambda: "return id(g_debug_sleep_wake);"
                then:
                  - lambda: |-
                      ESP_LOGI("motion_publish_loop", "[%lu] COMPLETE | id=motion_publish_loop | desc=Driver is now sleeping | result=SUCCESS",
                        (unsigned long) millis());

  - id: publish_all
    mode: queued
    then:
      - script.execute: publish_cover_position
      - sensor.template.publish:
          id: stepper_pos_sensor
          state: !lambda "return id(blind_stepper).current_position;"

  - id: publish_cover_position
    mode: queued
    then:
      - cover.template.publish:
          id: blind_cover
          position: !lambda |-
            int open_s = id(g_open_steps);
            int closed_s = id(g_closed_steps);
            int open_eff = open_s;
            if (open_eff <= closed_s) open_eff = closed_s + 1;
            float denom = float(open_eff - closed_s);
            float p = 0.0f;
            if (denom != 0.0f) {
              p = float(id(blind_stepper).current_position - closed_s) / denom;
            }
            if (p < 0.0f) p = 0.0f;
            if (p > 1.0f) p = 1.0f;
            return p;

  - id: move_to_steps
    mode: restart
    parameters:
      steps: int
    then:
      - script.execute: apply_runtime_tuning
      - script.execute: wake_driver

      - globals.set:
          id: target_position
          value: !lambda |-
            int open_s = id(g_open_steps);
            int closed_s = id(g_closed_steps);
            if (open_s <= closed_s) open_s = closed_s + 1;

            int max_travel = id(g_max_travel_steps);
            int open_cap = closed_s + max_travel;
            if (open_s > open_cap) open_s = open_cap;

            int t = steps;
            if (t < closed_s) t = closed_s;
            if (t > open_s) t = open_s;
            return t;

      - if:
          condition:
            lambda: |-
              int delta = id(target_position) - id(blind_stepper).current_position;
              if (delta < 0) delta = -delta;
              return delta <= id(g_min_delta_steps);
          then:
            # Delta too small - skip move, but still trigger sleep logic
            - cover.template.publish:
                id: blind_cover
                current_operation: IDLE
            - output.turn_off: motor_led
            - script.execute: publish_all
            - script.execute: post_move_sleep_manager
          else:
            - stepper.set_target:
                id: blind_stepper
                target: !lambda "return id(target_position);"
            - output.turn_on: motor_led
            - cover.template.publish:
                id: blind_cover
                current_operation: !lambda |-
                  if (id(target_position) > id(blind_stepper).current_position) {
                    return COVER_OPERATION_OPENING;
                  } else {
                    return COVER_OPERATION_CLOSING;
                  }
            - script.execute: motion_publish_loop
            # Note: finalize and sleep now handled inside motion_publish_loop

  - id: move_relative
    mode: restart
    parameters:
      steps: int
    then:
      - globals.set:
          id: target_position
          value: !lambda "return id(blind_stepper).current_position + steps;"
      - script.execute:
          id: move_to_steps
          steps: !lambda "return id(target_position);"

  - id: stepper_sensor_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: "return true;"
          then:
            - script.execute: publish_all
            - delay: !lambda "return (uint32_t) (id(g_sensor_interval_s) * 1000);"

  - id: apply_microstep_mode
    mode: restart
    then:
      - lambda: |-
          int ms = id(g_microstep_mode);
          bool ms1 = false;
          bool ms2 = false;
          bool ms3 = false;

          if (ms == 1)   { ms1=false; ms2=false; ms3=false; }
          if (ms == 2)   { ms1=true;  ms2=false; ms3=false; }
          if (ms == 4)   { ms1=false; ms2=true;  ms3=false; }
          if (ms == 8)   { ms1=true;  ms2=true;  ms3=false; }
          if (ms == 16)  { ms1=true;  ms2=true;  ms3=true;  }

          if (ms1) id(a4988_ms1).turn_on(); else id(a4988_ms1).turn_off();
          if (ms2) id(a4988_ms2).turn_on(); else id(a4988_ms2).turn_off();
          if (ms3) id(a4988_ms3).turn_on(); else id(a4988_ms3).turn_off();

  - id: rescale_steps_for_microstep_change
    mode: restart
    then:
      - lambda: |-
          int old_ms = id(g_last_microstep_mode);
          int new_ms = id(g_microstep_mode);
          if (old_ms <= 0) old_ms = 1;
          if (new_ms <= 0) new_ms = 1;
          if (old_ms == new_ms) return;

          float ratio = float(new_ms) / float(old_ms);

          id(g_open_steps)   = (int) lroundf(float(id(g_open_steps)) * ratio);
          id(g_closed_steps) = (int) lroundf(float(id(g_closed_steps)) * ratio);
          id(saved_position) = (int) lroundf(float(id(saved_position)) * ratio);

          id(blind_stepper).report_position(id(saved_position));
          id(blind_stepper).set_target(id(saved_position));
